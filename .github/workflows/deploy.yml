name: Deploy rndm

# Manual on purpose (Actions > Deploy rndm > Run workflow). To deploy on every push to main,
# add `push: { branches: [main] }` under `on:`.
# The image is built here, on the GitHub runner, and the server only pulls it,
# so the VM never runs a build (that is what exhausts a small VM).
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/rafaelkc/rndm:latest
            ghcr.io/rafaelkc/rndm:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            mkdir -p ~/rndm && cd ~/rndm
            curl -fsSL https://raw.githubusercontent.com/RafaelKC/rndm/main/docker-compose.yml -o docker-compose.yml
            docker compose pull
            docker compose up -d
            docker image prune -f
