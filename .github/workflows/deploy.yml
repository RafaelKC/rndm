name: Deploy rndm

# Manual on purpose (Actions > Deploy rndm > Run workflow). To deploy on every push to main,
# add `push: { branches: [main] }` under `on:` once the first deploys have gone well.
#
# 1. `image`: builds the Docker image HERE, on the GitHub runner, and pushes it to ghcr.io.
# 2. `deploy`: logs into the server over SSH with a dedicated deploy key. On the server that key
#    can run exactly one thing, /usr/local/bin/deploy-rndm.sh (an SSH forced command), which only pulls the
#    image tag we send and restarts the container. The server never builds anything.
# Setup: docs/deploy.md
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-rndm
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64 # the server is ARM; amd64 kept for local runs
          tags: |
            ghcr.io/rafaelkc/rndm:latest
            ghcr.io/rafaelkc/rndm:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH (forced command)
        env:
          HOST: ${{ secrets.RNDM_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.RNDM_DEPLOY_USER }}
          KEY: ${{ secrets.RNDM_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.RNDM_DEPLOY_KNOWN_HOSTS }}
          TAG: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server ignores the command text as a command: it only reads it as the image tag.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$HOST" "$TAG"
