# Serves the prerendered site (dist/rndm/browser).
#   /                 -> index.csr.html (client-side: picks a language from the cookie/browser)
#   /en/, /pt/        -> en/index.html, pt/index.html
#   /en/post/<id>     -> en/post/<id>/index.html (no redirect to a trailing slash: the canonical has none)
#   unknown paths     -> index.csr.html (the app redirects them to the home)
#   /posts/...        -> real files or a real 404 (the app redirects a missing post to the home)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/xml application/json application/javascript text/javascript image/svg+xml;

  # Build output with a content hash in the name never changes.
  location ~ ^/(?:main|chunk|styles|polyfills)-[A-Za-z0-9]+\.(?:js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The post list changes with every publish.
  location = /posts/index.json {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /posts/ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # Other static files are real files or a 404. Not .html: the HTML shell must never be cached
  # (it points to hashed files that change on every deploy), and the fallback below reaches it
  # through an internal redirect that would otherwise match this rule.
  location ~ \.(?:ico|png|jpe?g|webp|svg|woff2?|txt|xml|json|map|js|css)$ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location = / {
    add_header Cache-Control "no-cache";
    try_files /index.csr.html =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html /index.csr.html;
  }
}
