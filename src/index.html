    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://rndm.chicovis.dev/#website",
            "url": "https://rndm.chicovis.dev/",
            "name": "Random | Rafael Chicovis",
            "inLanguage": ["en", "pt-BR"],
            "publisher": { "@id": "https://chicovis.dev/#person" }
          },
          {
            "@type": "Person",
            "@id": "https://chicovis.dev/#person",
            "name": "Rafael Chicovis",

          }
        ]
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="https://chicovis.dev/favicon.svg" />

    <!-- Apply theme and language before first paint (no flash). Theme: cookie → system preference. -->
    <script>
      (function () {
        var root = document.documentElement;
        var theme = (document.cookie.match(/(?:^|; )theme=(dark|light)/) || [])[1];
        if (!theme) {
          try {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          } catch (e) {
            theme = 'dark';
          }
        }
        root.setAttribute('data-theme', theme);
        if (location.pathname.split('/')[1] === 'pt') root.setAttribute('lang', 'pt-BR');
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;700;800&display=swap"
